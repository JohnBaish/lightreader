const narrow = innerWidth < 720
if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.dataset.theme = 'dark'
const rows = DATA.rows, n = rows.length, ti = rows.findIndex(r => r[0] === DATA.today)
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
const fmt = s => { const a = Math.round(Math.abs(s)); return `${Math.floor(a/60)}m ${a%60}s` }

function chart({ h, fill, labels, hero }) {
  const W = narrow ? 330 : 1000, padL = narrow ? 34 : 42, padR = 8, padT = 10, padB = 22
  const H = h, iw = W - padL - padR, ih = H - padT - padB
  const max = 270 // ±4m 30s, so the peaks clear the edges
  const x = i => padL + (i / (n - 1)) * iw, y = v => padT + ih / 2 - (v / max) * (ih / 2)
  const pts = rows.map((r, i) => [x(i), y(r[1])])
  const path = 'M' + pts.map(p => p.map(v => v.toFixed(1)).join(',')).join('L')
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily change in daylight over the year">`
  for (const v of [-240, -120, 120, 240]) s += `<line class="grid" x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}"/>`
  for (const v of [-240, -120, 0, 120, 240]) s += `<text class="axis" x="${padL-6}" y="${y(v)+4}" text-anchor="end">${v === 0 ? '0' : (v > 0 ? '+' : '−') + Math.abs(v/60) + 'm'}</text>`
  if (fill) {
    const z = y(0)
    s += `<clipPath id="up${h}"><rect x="0" y="0" width="${W}" height="${z}"/></clipPath><clipPath id="dn${h}"><rect x="0" y="${z}" width="${W}" height="${H}"/></clipPath>`
    const area = `${path}L${x(n-1)},${z}L${x(0)},${z}Z`
    s += `<path class="gain" d="${area}" clip-path="url(#up${h})"/><path class="loss" d="${area}" clip-path="url(#dn${h})"/>`
  }
  s += `<line class="zero" x1="${padL}" x2="${W-padR}" y1="${y(0)}" y2="${y(0)}"/>`
  s += `<path class="line" d="${path}"/>`
  // months: the first of each, letter on a phone
  rows.forEach((r, i) => { if (r[0].endsWith('-01')) { const m = MONTHS[+r[0].slice(5,7)-1]; s += `<text class="axis" x="${x(i)}" y="${H-6}" text-anchor="middle">${narrow ? m[0] : m}</text>` } })
  s += `<line class="today" x1="${x(ti)}" x2="${x(ti)}" y1="${padT}" y2="${padT+ih}"/>`
  s += `<circle class="dot" cx="${x(ti)}" cy="${y(rows[ti][1])}" r="5"/>`
  if (labels) {
    const tx = x(ti) + 8, ty = y(rows[ti][1]) + 18
    s += `<text class="tag" x="${tx}" y="${ty}">Today −${fmt(rows[ti][1])}</text>`
    if (fill) {
      s += `<text class="inlabel" x="${x(Math.round(n*0.86))}" y="${y(narrow ? 45 : 60)}" text-anchor="middle" fill="#201e1d">${narrow ? 'Longer' : 'Days getting longer'}</text>`
      s += `<text class="inlabel" x="${x(Math.round(n*(narrow ? 0.3 : 0.36)))}" y="${y(narrow ? -55 : -70)}" text-anchor="middle" fill="#f5ead8">${narrow ? 'Shorter' : 'Days getting shorter'}</text>`
    } else {
      s += `<text class="tagsoft" x="${x(Math.round(n*(narrow ? 0.8 : 0.84)))}" y="${y(30)-6}" text-anchor="middle">${narrow ? 'longer' : 'longer each day'}</text>`
      s += `<text class="tagsoft" x="${x(Math.round(n*(narrow ? 0.3 : 0.36)))}" y="${y(-30)+14}" text-anchor="middle">${narrow ? 'shorter' : 'shorter each day'}</text>`
    }
  }
  return s + '</svg>'
}

const words = `<ul>
  <li>Daylight is shrinking by 3m 40s a day, and by 4.2% (25m) over the next week.</li>
  <li>The most it shrinks in a year is 3m 54s a day, around September 25th.</li>
</ul>`
const note = '<p class="note">Draft wording. The line shows how much daylight each day gains or loses against the day before, from six months ago to six months ahead.</p>'

const card = (body) => `<section class="card year pace"><div class="year-head"><h3>Pace of change</h3><span class="muted">April 2026 to April 2027</span></div>${body}</section>`
root.innerHTML = [
  '<p class="opt">Option A: shaded above and below zero</p>' + card(chart({ h: narrow ? 220 : 260, fill: true, labels: true }) + words + note),
  '<p class="opt">Option B: the line on its own</p>' + card(chart({ h: narrow ? 200 : 220, fill: false, labels: true }) + words),
  '<p class="opt">Option C: today\'s figure first, a small chart under it</p>' + card(`<div class="hero"><b>−3m 40s</b><span>daylight a day, today</span></div>` + chart({ h: narrow ? 120 : 120, fill: true, labels: false }) + words),
].join('')

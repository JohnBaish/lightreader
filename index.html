<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lightreader – sunrise, sunset and twilight times in England</title>
    <meta name="description" content="Free sunrise, sunset and twilight times for any postcode in England: today, through the year, and compared with dates or places you choose." />
    <link rel="canonical" href="https://lightreader.baish.net/" />
    <!-- Search (SEO): the <title> and search description are for search results (John,
         28 October); the canonical link names the one main address. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Link previews: the og:/twitter: tags keep the shorter wording drawn into the picture
         (design/og-lightreader.html; John, 28 October). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lightreader" />
    <meta property="og:description" content="Sunrise, sunset and light-based facts for English places you choose." />
    <meta property="og:image" content="https://lightreader.baish.net/og-lightreader.png" />
    <meta property="og:url" content="https://lightreader.baish.net/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lightreader" />
    <meta name="twitter:description" content="Sunrise, sunset and light-based facts for English places you choose." />
    <meta name="twitter:image" content="https://lightreader.baish.net/og-lightreader.png" />
    <!-- Dark mode: set before the page draws, so a visitor who chose it never sees a flash of
         the light page. The same key as src/lib/theme.ts. -->
    <script>
      try { if (localStorage.getItem('lightreader.theme') === 'dark') document.documentElement.dataset.theme = 'dark' } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
